apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-applier
  namespace: demo-services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-applier-redis
  namespace: demo-services
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
      - services
      - serviceaccounts
    verbs: &a1
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs: *a1
  - apiGroups:
      - networking.istio.io
    resources:
      - virtualservices
    verbs: *a1
  - apiGroups:
      - ""
    resources:
      - pods
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-applier-redis
  namespace: demo-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-applier-redis
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: demo-services
