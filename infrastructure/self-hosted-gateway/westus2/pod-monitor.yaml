apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: otel-collector
  namespace: apim-gateway
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: self-hosted-gateway
spec:
  labelLimit: 63
  labelNameLengthLimit: 511
  labelValueLengthLimit: 1023
  namespaceSelector:
    matchNames:
      - apim-gateway
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
