apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: apim-gateway
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: self-hosted-gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: apim-gateway
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: self-hosted-gateway
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      udp_log/shg-requests:
        listen_address: 0.0.0.0:8888
        one_log_per_packet: true
        operators:
          - type: json_parser
            parse_from: body
            parse_to: attributes
            on_error: drop
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch: {}
      filter/shg-requests:
        error_mode: ignore
        logs:
          log_record:
            - attributes["apiId"] == nil
      transform/shg-requests:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["url_path"], "unmapped")
              - set(attributes["url_path"], "/mssql/api/customers") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "createCustomer"
              - set(attributes["url_path"], "/mssql/api/customers") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "findAllCustomers"
              - set(attributes["url_path"], "/mssql/api/customers/{id}") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "findCustomerById"
              - set(attributes["url_path"], "/mssql/api/customers/{id}") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "updateCustomer"
              - set(attributes["url_path"], "/mssql/api/customers/{id}") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "deleteCustomer"
              - set(attributes["url_path"], "/mssql/api/products") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "createProduct"
              - set(attributes["url_path"], "/mssql/api/products") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "findAllProducts"
              - set(attributes["url_path"], "/mssql/api/products/active") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "findAllActiveProducts"
              - set(attributes["url_path"], "/mssql/api/products/{id}") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "findProductById"
              - set(attributes["url_path"], "/mssql/api/products/{id}") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "updateProduct"
              - set(attributes["url_path"], "/mssql/api/products/{id}") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "deleteProduct"
              - set(attributes["url_path"], "/mssql/api/loan-applications") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "createLoanApplication"
              - set(attributes["url_path"], "/mssql/api/loan-applications") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "findAllLoanApplications"
              - set(attributes["url_path"], "/mssql/api/loan-applications/{id}") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "findLoanApplicationById"
              - set(attributes["url_path"], "/mssql/api/loan-applications/{id}/status") where attributes["apiId"] == "resiliency-app-mssql" and attributes["operationId"] == "updateLoanApplicationStatus"
              - set(attributes["url_path"], "/pgsql/api/branches") where attributes["apiId"] == "resiliency-app-pgsql" and attributes["operationId"] == "createBranch"
              - set(attributes["url_path"], "/pgsql/api/branches") where attributes["apiId"] == "resiliency-app-pgsql" and attributes["operationId"] == "findAllBranches"
              - set(attributes["url_path"], "/pgsql/api/branches/{id}") where attributes["apiId"] == "resiliency-app-pgsql" and attributes["operationId"] == "findBranchById"
              - set(attributes["url_path"], "/pgsql/api/branches/{id}") where attributes["apiId"] == "resiliency-app-pgsql" and attributes["operationId"] == "updateBranch"
              - set(attributes["url_path"], "/pgsql/api/branches/{id}") where attributes["apiId"] == "resiliency-app-pgsql" and attributes["operationId"] == "deleteBranch"
              - set(attributes["url_path"], "/shg-smoke/ping") where attributes["apiId"] == "shg-smoke" and attributes["operationId"] == "get-gateway"
              - set(attributes["api_id"], ToLowerCase(attributes["apiId"]))
              - set(attributes["operation_id"], ToLowerCase(attributes["operationId"]))
              - set(attributes["response_code"], String(attributes["responseCode"]))
              - set(attributes["backend_response_code"], String(attributes["backendResponseCode"])) where attributes["backendResponseCode"] != nil
              - set(attributes["backend_host"], ToLowerCase(ExtractPatterns(attributes["backendUrl"], "^https?://(?P<host>[^/:?#]+)")["host"])) where attributes["backendUrl"] != nil
              - delete_key(attributes, "url")
              - delete_key(attributes, "backendUrl")
              - delete_key(attributes, "callerIpAddress")
              - delete_key(attributes, "userAgent")
              - delete_key(attributes, "correlationId")
              - delete_key(attributes, "connectionId")
      delta_to_cumulative: {}
    connectors:
      signal_to_metrics/shg-requests:
        error_mode: ignore
        logs:
          - name: shg.log.requests
            description: Gateway requests derived from SHG request logs.
            unit: "{request}"
            conditions:
              - attributes["responseCode"] != nil
            attributes:
              - key: api_id
              - key: operation_id
              - key: url_path
              - key: response_code
              - key: method
                optional: true
              - key: backend_response_code
                optional: true
              - key: backend_host
                optional: true
            sum:
              value: "1"
              monotonic: true
          - name: shg.log.request.duration
            description: Total gateway time per request from SHG request logs.
            unit: ms
            conditions:
              - attributes["responseCode"] != nil
              - attributes["totalTime"] != nil
            attributes:
              - key: api_id
              - key: operation_id
              - key: url_path
              - key: response_code
            histogram:
              buckets: [5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000]
              value: Double(attributes["totalTime"])
          - name: shg.log.backend.duration
            description: Backend time per request from SHG request logs.
            unit: ms
            conditions:
              - attributes["responseCode"] != nil
              - attributes["backendTime"] != nil
            attributes:
              - key: api_id
              - key: operation_id
              - key: url_path
              - key: backend_host
                optional: true
            histogram:
              buckets: [5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000]
              value: Double(attributes["backendTime"])
          - name: shg.log.incomplete.records
            description: SHG request logs with an API but without a response code, excluded from the other metrics.
            unit: "{record}"
            conditions:
              - attributes["responseCode"] == nil
            attributes:
              - key: api_id
              - key: operation_id
            sum:
              value: "1"
              monotonic: true
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs/shg-requests:
          receivers: [udp_log/shg-requests]
          processors: [memory_limiter, filter/shg-requests, transform/shg-requests]
          exporters: [signal_to_metrics/shg-requests]
        metrics/shg-requests:
          receivers: [signal_to_metrics/shg-requests]
          processors: [delta_to_cumulative, memory_limiter, batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: apim-gateway
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: self-hosted-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      annotations:
        # The pod reads its config only at start; a test requires this to be the
        # SHA-256 of the ConfigMap so any config change also rolls the pod.
        credicorp.com/config-sha256: "95addea79fe8050b811d7068309bfbace156ff3d8ae7d9006f01669e3097c1ab"
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: self-hosted-gateway
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.azure.com/agentpool: workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: prometheus
              containerPort: 8889
              protocol: TCP
            - name: shg-logs
              containerPort: 8888
              protocol: UDP
            - name: health
              containerPort: 13133
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: apim-gateway
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: self-hosted-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
      appProtocol: grpc
    - name: prometheus
      port: 8889
      targetPort: prometheus
      protocol: TCP
    - name: shg-logs
      port: 8888
      targetPort: shg-logs
      protocol: UDP
