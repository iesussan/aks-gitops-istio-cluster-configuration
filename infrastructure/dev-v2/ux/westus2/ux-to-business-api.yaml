apiVersion: v1
kind: Secret
metadata:
  name: "ux-to-business-api-trust"
  namespace: "demo-services"
type: Opaque
data:
  cacert: ""
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: "ux-to-business-api"
  namespace: "demo-services"
  labels:
    networking.istio.io/enable-autoallocate-ip: "true"
spec:
  hosts:
    - "private-apis.cloudcompany.pe"
  exportTo: ["."]
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 80
      name: http
      protocol: HTTP
      targetPort: 443
  subjectAltNames:
    - "private-apis.cloudcompany.pe"
  endpoints:
    - address: "westus2.apim.internal.cloudcompany.pe"
      locality: "westus2"
      labels:
        topology.kubernetes.io/region: "westus2"
      ports:
        http: 443
    - address: "westus3.apim.internal.cloudcompany.pe"
      locality: "westus3"
      labels:
        topology.kubernetes.io/region: "westus3"
      ports:
        http: 443
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: "ux-to-business-api"
  namespace: "demo-services"
spec:
  host: "private-apis.cloudcompany.pe"
  exportTo: ["."]
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
      localityLbSetting:
        enabled: true
        failover:
          - from: "westus2"
            to: "westus3"
          - from: "westus3"
            to: "westus2"
    connectionPool:
      tcp:
        connectTimeout: 3s
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 100
        maxRequestsPerConnection: 100
    outlierDetection:
      splitExternalLocalOriginErrors: true
      consecutiveLocalOriginFailures: 2
      consecutiveGatewayErrors: 2
      consecutive5xxErrors: 2
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
      minHealthPercent: 0
    tls:
      mode: SIMPLE
      credentialName: "ux-to-business-api-trust"
      sni: "private-apis.cloudcompany.pe"
      subjectAltNames:
        - "private-apis.cloudcompany.pe"
  workloadSelector:
    matchLabels:
      app.kubernetes.io/part-of: "resiliency-app-ux-redis"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: "ux-to-business-api"
  namespace: "demo-services"
spec:
  hosts:
    - "private-apis.cloudcompany.pe"
  gateways: ["mesh"]
  exportTo: ["."]
  http:
    - name: safe-methods
      match:
        - method:
            regex: "^(?:GET|HEAD|OPTIONS)$"
      timeout: "10s"
      retries:
        attempts: 2
        perTryTimeout: "10s"
        retryOn: connect-failure,reset,503
        retryRemoteLocalities: true
      rewrite:
        uriRegexRewrite:
          match: "^/api/employees(.*)$"
          rewrite: "/resiliency-app-redis/api/employees\\1"
      route:
        - destination:
            host: "private-apis.cloudcompany.pe"
            port:
              number: 80
          weight: 100
    - name: mutating-methods
      match:
        - method:
            regex: "^(?:POST|PUT|PATCH|DELETE)$"
      timeout: "10s"
      retries:
        attempts: 0
      rewrite:
        uriRegexRewrite:
          match: "^/api/employees(.*)$"
          rewrite: "/resiliency-app-redis/api/employees\\1"
      route:
        - destination:
            host: "private-apis.cloudcompany.pe"
            port:
              number: 80
          weight: 100
    - name: other-methods
      timeout: "10s"
      retries:
        attempts: 0
      rewrite:
        uriRegexRewrite:
          match: "^/api/employees(.*)$"
          rewrite: "/resiliency-app-redis/api/employees\\1"
      route:
        - destination:
            host: "private-apis.cloudcompany.pe"
            port:
              number: 80
          weight: 100
