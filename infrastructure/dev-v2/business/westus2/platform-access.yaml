apiVersion: v1
kind: Namespace
metadata:
  name: "demo-services"
  labels:
    istio.io/rev: "asm-1-30"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "demo-services"
  namespace: "demo-services"
  annotations:
    azure.workload.identity/client-id: "fc96aa7d-8350-429c-8741-a0126dae95a2"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-applier
  namespace: "demo-services"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-applier
  namespace: "demo-services"
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-applier
  namespace: "demo-services"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-applier
subjects:
  - kind: ServiceAccount
    name: flux-applier
    namespace: "demo-services"
