apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: "istio-ingress-gateway-internal-westus2"
  namespace: "aks-istio-ingress"
spec:
  selector:
    istio: aks-istio-ingressgateway-internal
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "demo-services.internal.cloudcompany.pe"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: "business-api-ingress-westus2"
  namespace: "demo-services"
spec:
  hosts:
    - "demo-services.internal.cloudcompany.pe"
  gateways:
    - "aks-istio-ingress/istio-ingress-gateway-internal-westus2"
  http:
    - match:
        - uri:
            prefix: "/api/employees"
      timeout: "10s"
      retries:
        attempts: 0
      rewrite:
        uri: "/api/employees"
      route:
        - destination:
            host: "resiliency-app-redis-aks.demo-services.svc.cluster.local"
            port:
              number: 80
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: "resiliency-app-redis-strict-mtls"
  namespace: "demo-services"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: "resiliency-app-redis"
  mtls:
    mode: STRICT
