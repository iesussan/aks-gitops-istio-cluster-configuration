apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: "resiliency-app-redis"
  namespace: "demo-services"
spec:
  interval: 5m
  releaseName: "resiliency-app-redis"
  targetNamespace: "demo-services"
  serviceAccountName: flux-applier
  chartRef:
    kind: OCIRepository
    name: "resiliency-app-redis-chart"
    namespace: "demo-services"
  install:
    createNamespace: false
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: "resiliency-app-redis-values"
      valuesKey: values.yaml
