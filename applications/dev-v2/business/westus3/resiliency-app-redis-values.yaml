apiVersion: v1
kind: ConfigMap
metadata:
  name: "resiliency-app-redis-values"
  namespace: "demo-services"
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    app:
      businessUnit: employee-management
      imageName: apps/resiliency-app-redis
      name: resiliency-app-redis
      profile: aks
      shortName: redis
    clusterIssuer:
      enabled: false
    configMap:
      data:
        REDIS_HOST: redis-mr-v2-dev-westus3-001.westus3.redis.azure.net
        REDIS_PORT: 10000
        REDIS_USERNAME: 8a5aaa81-d513-4ef4-9514-e5f4e0406a92
    global:
      acrLoginServer: acrmrv2businessdevwus3001.azurecr.io
      imagePullPolicy: IfNotPresent
      imageTag: 0.1.4@sha256:df3ee82920d61a876f65dcd667c3c92baaa66973662271cf80ae8f125e16272a
    hpa:
      enabled: false
    ingress:
      enabled: false
    keda:
      enabled: false
    namespace: demo-services
    nodeSelector:
      kubernetes.azure.com/agentpool: workload
      workload-type: null
    probes:
      liveness:
        failureThreshold: 5
        path: /actuator/health/liveness
        periodSeconds: 10
      readiness:
        failureThreshold: 3
        path: /actuator/health
        periodSeconds: 5
      startup:
        failureThreshold: 12
        initialDelaySeconds: 30
        path: /actuator/health/liveness
        periodSeconds: 5
    replicas: 2
    resources:
      limits:
        cpu: '1'
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    workloadIdentity:
      clientId: 3a677d12-88c7-40db-94e1-3a8643406f52
      createServiceAccount: true
      enabled: true
      serviceAccountName: demo-services
