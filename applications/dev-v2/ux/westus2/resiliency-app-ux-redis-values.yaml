apiVersion: v1
kind: ConfigMap
metadata:
  name: "resiliency-app-ux-redis-values"
  namespace: "demo-services"
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    app:
      businessUnit: employee-management
      imageName: apps/resiliency-app-ux-redis
      name: resiliency-app-ux-redis
      profile: aks
      shortName: ux-redis
    clusterIssuer:
      enabled: false
    configMap:
      data:
        BACKEND_EMPLOYEES_BASE_URL: http://employees-v1.private-apis.cloudcompany.pe
        BACKEND_EMPLOYEES_HEALTH_ENABLED: false
        BACKEND_EMPLOYEES_HEALTH_URL: http://localhost:8080/actuator/health/liveness
        BACKEND_EMPLOYEES_TIMEOUT: 10s
        SERVER_PORT: 8080
    global:
      acrLoginServer: acrmrv2uxdevwus2001.azurecr.io
      imagePullPolicy: IfNotPresent
      imageTag: 0.1.5@sha256:4b02ca5a1ca3673aef5b2d4aee2e4594864479a28b9fddc20d03b37208125b90
    hpa:
      enabled: false
    ingress:
      enabled: false
    keda:
      enabled: false
    namespace: demo-services
    nodeSelector:
      kubernetes.azure.com/agentpool: workload
      workload-type: null
    probes:
      liveness:
        failureThreshold: 5
        path: /actuator/health/liveness
        periodSeconds: 10
      readiness:
        failureThreshold: 3
        path: /actuator/health
        periodSeconds: 5
      startup:
        failureThreshold: 12
        initialDelaySeconds: 30
        path: /actuator/health/liveness
        periodSeconds: 5
    replicas: 2
    resources:
      limits:
        cpu: '1'
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    workloadIdentity:
      clientId: ''
      createServiceAccount: false
      enabled: false
      serviceAccountName: default
