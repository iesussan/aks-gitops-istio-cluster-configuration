apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: demo-services
spec:
  interval: 5m
  releaseName: redis
  targetNamespace: demo-services
  chartRef:
    kind: OCIRepository
    name: redis
    namespace: demo-services
  install:
    createNamespace: false
  valuesFrom:
    - kind: ConfigMap
      name: redis-values
      valuesKey: values.yaml
