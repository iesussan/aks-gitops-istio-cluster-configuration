apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-services
resources:
  - source.yaml
  - release.yaml
configMapGenerator:
  - name: redis-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
